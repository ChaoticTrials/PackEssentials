import com.modrinth.minotaur.dependencies.ModDependency
import org.w3c.dom.Document
import org.w3c.dom.NodeList

import javax.xml.parsers.DocumentBuilderFactory

buildscript {
    apply from: 'https://moddingx.github.io/ModUtils/v5/buildscript.gradle', to: buildscript
}

apply from: 'https://moddingx.github.io/ModUtils/v5/mod.gradle'

apply plugin: 'org.moddingx.modgradle.cursedep'
apply plugin: 'maven-publish'
mod['version'] = getVersion(mod.minecraft + "-" + mod.base_version, new URL(mod.remote_maven + "/" + group.replace('.', '/') + "/" + name + "/maven-metadata.xml"))
project.version = mod.version

repositories {
    maven {
        name = "Mirror for many mods"
        url = "https://modmaven.dev/"
    }
    maven {
        url = "https://maven.twelveiterations.com/repository/maven-public/"
    }
}

dependencies {
    annotationProcessor fg.deobf("org.moddingx:LibX:1.20.1-5.0.14")

    implementation fg.deobf("org.moddingx:LibX:1.20.1-5.0.14")
    implementation curse.mod(324717, 5339264)
    compileOnly fg.deobf("net.blay09.mods:balm-forge:7.3.38+1.20.1")
    compileOnly fg.deobf("net.blay09.mods:cookingforblockheads-forge:16.0.14+1.20.1")

    runtimeOnly fg.deobf("mezz.jei:jei-1.20.1-forge:15.20.0.130")
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            groupId = project.group
            artifactId = project.name
            version = project.version
            artifact(jar) {
                builtBy project.provider { project.tasks.named('reobfJar') }
            }
            if (mod.sources) {
                artifact(sourceJar)
            }
            pom {
                licenses {
                    license {
                        name = mod.license
                        url = mod.license_url.toString()
                    }
                }
            }
        }
    }
    repositories {
        maven {
            name = 'melanx'
            url mod.remote_maven
            credentials(PasswordCredentials)
        }
    }
}
publish.dependsOn('reobfJar')

// Copied from ModUtils v5 to use the updated version number and file name.
// See here:
// https://github.com/ModdingX/ModUtils/blob/48b7aae7b6dcb52c77eb0868b4b4d74f930bda77/scripts/mod/upload_modrinth.gradle
apply plugin: 'com.modrinth.minotaur'
String modrinthChangelog = mod.gitChangelog()
modrinth {
    if ('modrinth_auth' in secrets) {
        token = secrets.modrinth_auth.toString()
    } else if (System.getenv('MODRINTH_UPLOAD_TOKEN')) {
        token = System.getenv('MODRINTH_UPLOAD_TOKEN')
    } else {
        token = 'mrp_Og2W6fceO6JO4yjpzp9h3OXg1igV8ZoBCn8XMWdOYNmA0jxo8dg6wVzCA8Ng'
    }
    projectId = mod.modrinth.project
    versionNumber = project.version
    versionName = jar.getArchiveFileName().get()
    uploadFile = jar
    if (mod.sources) {
        additionalFiles = [sourceJar]
    }

    changelog = modrinthChangelog
    versionType = mod.modrinth.release
    gameVersions = mod.modrinth.versions
    loaders = ["forge"]

    dependencies = []
    mod.modrinth.requirements.each { dependencies.add(new ModDependency(it, "required")) }
    mod.modrinth.optionals.each { dependencies.add(new ModDependency(it, "optional")) }
}
project.tasks.getByName('modrinth').dependsOn('reobfJar')

private static String getVersion(String baseVersion, URL url) {
    try {
        HttpURLConnection connection = (HttpURLConnection) url.openConnection()
        connection.setRequestMethod("GET")

        Document doc = DocumentBuilderFactory.newInstance().newDocumentBuilder().parse(connection.getInputStream())
        NodeList versionNodes = doc.getElementsByTagName("version")

        String latestVersion = null;
        for (int i = 0; i < versionNodes.getLength(); i++) {
            String version = versionNodes.item(i).getTextContent()
            if (version.startsWith(baseVersion)) {
                latestVersion = version
            }
        }

        if (latestVersion == null) {
            return baseVersion + ".0"
        }

        return baseVersion + "." + (Integer.parseInt(latestVersion.substring(latestVersion.lastIndexOf('.') + 1)) + 1)
    } catch (FileNotFoundException ignored) {
        // This exception is thrown if the maven-metadata.xml file doesn't exist at the provided URL,
        // which would be the case if there were no previous publications to this Maven repository with this project
        return baseVersion + ".0"
    } catch (Exception e) {
        throw new RuntimeException(e)
    }
}
